<div>
    <div class="flexbox flexcenter" style="padding-top: 3em;">
        <div>
            @for (ronde of rondes; track $index) {
                <div class="flexbox flemiddle ronde-container" [ngClass]="{'selected': $index == idxRonde}">
                    <div class="ronde-id" style="width: 2em;">{{ronde.rndId}}.</div>
                    <div class="ronde-id" style="width: 12em;">{{ronde.rndNaam}}</div>
                    <div style="width: 8em; position: relative;">
                        <div class="ronde-button">
                            <app-button [button]="buttons[$index].btns[0]" [disabled]="!ronde.status.gepland" 
                                        (btnClicked)="planningClicked($index)"></app-button>
                        </div>
                    </div>
                    <div style="width: 8em; position: relative;">
                        <div class="ronde-button">
                            <app-button [button]="buttons[$index].btns[1]" [disabled]="$last ? !finale.status.gereed : !ronde.status.gereed" 
                                        (btnClicked)="resultaatClicked($index)"></app-button>
                        </div>
                    </div>
                </div>
            }
            <hr>
            <div class="flexbox flemiddle ronde-container">
                <div style="width: 14em;"></div>
                <div style="width: 16em;">
                    <div class="ronde-button">
                        <app-button [button]="moyButton" [disabled]="!finale.status.gereed" 
                                    (btnClicked)="moyennesClicked()"></app-button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
